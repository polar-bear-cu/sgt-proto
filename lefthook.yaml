commit-msg:
  commands:
    conventional:
      run: sh scripts/commit-msg.sh {1}

pre-commit:
  parallel: true
  commands:
    proto-format:
      glob: "*.proto"
      run: buf format -w
      stage_fixed: true
    proto-lint:
      glob: "*.proto"
      run: buf lint
    go-fmt:
      glob: "*.go"
      run: gofmt -w {staged_files}
      stage_fixed: true

pre-push:
  parallel: false
  commands:
    lint:
      run: buf lint
    breaking:
      run: buf breaking --against '.git#branch=main'
    gen-drift:
      run: buf generate && git diff --exit-code gen/
    build:
      run: go build ./...
