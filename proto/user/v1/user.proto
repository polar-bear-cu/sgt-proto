syntax = "proto3";

package user.v1;

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string picture_url = 4;
  // Todo: Fill the rest
}

message FindOrCreateUserRequest {
  string email = 1;
  string google_sub = 2;
  string name = 3;
  string picture_url = 4;
  // TODO: Fill the rest
}

message FindOrCreateUserResponse {
  User user = 1;
  bool created = 2; // true = create user, false = find user
}

message UpdateProfileRequest {
  string id = 1;
  string display_name = 2;
  string picture_url = 3;
}

message UpdateProfileResponse {
  User user = 1;
}

message GetUserRequest {
  string id = 1;
}

message GetUserResponse {
  User user = 1;
}

message DeleteUserRequest {
  string id = 1;
}

message DeleteUserResponse {
  bool success = 1;
}

message ListUsersRequest {
  int32 limit = 1;
  int32 offset = 2;
}

message ListUsersResponse {
  repeated User users = 1;
}

message UpdateRoleRequest {
  string id = 1;
  string role = 2;
}

message UpdateRoleResponse {
  User user = 1;
}

service UserService {
  rpc FindOrCreateUser(FindOrCreateUserRequest) returns (FindOrCreateUserResponse);
  rpc UpdateProfile(UpdateProfileRequest) returns (UpdateProfileResponse);
  rpc GetUser(GetUserRequest) returns (GetUserResponse);
  rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
  rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
  rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
}
